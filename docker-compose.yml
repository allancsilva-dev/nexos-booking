services:
  redis:
    image: redis:8-alpine
    container_name: nexos-booking-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: nexos-booking-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    container_name: nexos-booking-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
    ports:
      - "${WEB_PORT}:3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexos-booking-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      APP_RUNTIME_USER: ${APP_RUNTIME_USER}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD}
      DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-nexos:production}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_API_BASE_URL: ${ASAAS_API_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      BILLING_ENFORCEMENT_ENABLED: ${BILLING_ENFORCEMENT_ENABLED:-false}
    ports:
      - "${API_PORT}:3001"

volumes:
  postgres_data:
  redis_data:
